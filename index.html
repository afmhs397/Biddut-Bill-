<!DOCTYPE html>
<html lang="bn"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d6fe8">
<title>বিশ্বাস ভবন — বিদ্যুৎ বিল</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#1d2433;--mut:#667085;--pri:#1d6fe8;--bd:#d9dee8;--err:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#10141c;--card:#1a2130;--tx:#e8ecf4;--mut:#9aa6bd;--bd:#2c3649;--pri:#5b9bff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0px);
 font-family:"Noto Sans Bengali","Nirmala UI","Kalpurush","Siyam Rupali",system-ui,sans-serif}
header{background:var(--pri);color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));text-align:center}
header h1{margin:0;font-size:1.3rem} header p{margin:0;font-size:.88rem;opacity:.9}
main{max-width:1000px;margin:0 auto;padding:12px;display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.card h2{margin:0 0 8px;font-size:1.05rem} .full{grid-column:1/-1}
label{display:block;font-size:.88rem;color:var(--mut);margin:8px 0 3px}
input[type=text],input[type=number]{width:100%;padding:11px 12px;font-size:16px;font-family:inherit;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--tx)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{flex:1 1 110px;padding:11px;font-size:15px;font-family:inherit;border:0;border-radius:8px;background:var(--pri);color:#fff}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.sm{flex:0 0 auto;padding:5px 10px;font-size:13px} button.del{background:var(--err)}
.hint{color:var(--mut)} .err{color:var(--err);font-weight:600}
.head{text-align:center;border-bottom:2px dashed var(--bd);padding-bottom:8px;margin-bottom:8px}
.head b{font-size:1.3rem;display:block}
table{width:100%;border-collapse:collapse;font-size:.93rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--bd)} th{text-align:left;color:var(--mut)}
.n{text-align:right;white-space:nowrap} .scroll{overflow-x:auto}
.tot td{font-weight:700;font-size:1.1rem;border-top:2px solid var(--tx);border-bottom:0}
.info{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.93rem}
@media print{body{background:#fff;color:#000} header,.no-print{display:none!important}
 main{display:block;padding:0} .card{border:0;padding:0} .card:not(.billcard){display:none}}
#ov{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);overflow:auto;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
#ov .box{max-width:560px;margin:0 auto;background:var(--card);border-radius:12px;padding:14px}
#ov img{width:100%;border:1px solid var(--bd);border-radius:8px;background:#fff}
a.btn{flex:1 1 110px;padding:11px;font-size:15px;border-radius:8px;background:var(--pri);color:#fff;text-align:center;text-decoration:none}
@media print{#ov{display:none!important}}
</style></head><body>
<header><h1>বিশ্বাস ভবন</h1><p>ভাড়াটিয়ার বিদ্যুৎ বিল</p></header>
<main>
<section class="card no-print">
 <h2>ইউনিট দিন</h2>
 <label for="name">ভাড়াটিয়ার নাম / ফ্ল্যাট</label>
 <input type="text" id="name" list="tenants" autocomplete="off" placeholder="যেমন: ২য় তলা - রহিম">
 <datalist id="tenants"></datalist>
 <div class="two">
  <div><label for="prev">পূর্বের ইউনিট</label><input type="number" id="prev" inputmode="decimal" step="any" min="0"></div>
  <div><label for="curr">বর্তমান ইউনিট</label><input type="number" id="curr" inputmode="decimal" step="any" min="0"></div>
 </div>
 <div class="two">
  <div><label for="vat">ভ্যাট (%)</label><input type="number" id="vat" inputmode="decimal" step="any" value="5"></div>
  <div><label for="other">অন্যান্য চার্জ (টাকা)</label><input type="number" id="other" inputmode="decimal" step="any" value="0"></div>
 </div>
 <label class="chk"><input type="checkbox" id="demand"> ডিমান্ড চার্জ ধরুন (লোড × ৪২ টাকা)</label>
 <div id="loadbox" style="display:none"><label for="load">লোড (কিলোওয়াট)</label><input type="number" id="load" inputmode="decimal" step="any" value="0"></div>
 <div class="btns">
  <button id="saveBtn">সংরক্ষণ</button>
  <button class="sec" id="printBtn">🖨 PDF প্রিন্ট</button>
  <button class="sec" id="shareBtn">PDF শেয়ার</button>
 </div>
</section>
<section class="card billcard"><h2 class="no-print">বিল</h2>
 <div id="bill"><p class="hint">পূর্বের ও বর্তমান ইউনিট লিখলেই বিল এখানে দেখাবে।</p></div></section>
<section class="card full no-print">
 <h2>সংরক্ষিত হিসাব</h2>
 <div class="scroll"><table><thead><tr><th>তারিখ</th><th>নাম</th><th class="n">পূর্বের</th><th class="n">বর্তমান</th><th class="n">ইউনিট</th><th class="n">বিল</th><th></th></tr></thead><tbody id="recs"></tbody></table></div>
 <div class="btns"><button class="sec" id="csvBtn">CSV এক্সপোর্ট</button></div>
</section>
</main>
<div id="ov"><div class="box">
 <h2 style="margin:0 0 6px;font-size:1.05rem">বিল PDF প্রস্তুত</h2>
 <p class="hint" style="margin:0 0 10px;font-size:.9rem">ডাউনলোড না হলে নিচের ছবিটি চেপে ধরে "ছবি সেভ করুন" দিন, অথবা স্ক্রিনশট নিন।</p>
 <img id="pv" alt="বিল">
 <div class="btns"><a class="btn" id="dl" href="#">PDF ডাউনলোড</a><a class="btn" id="dl2" href="#">বিকল্প ডাউনলোড</a><button class="sec" id="ovClose">বন্ধ করুন</button></div>
</div></div>
<script>
// ===== সেটিংস =====
var HOUSE = "বিশ্বাস ভবন", DEMAND_RATE = 42, LIFE_LIMIT = 50, LIFE_RATE = 4.63;
var SLABS = [["প্রথম ধাপ (০-৭৫)",75,5.26],["দ্বিতীয় ধাপ (৭৬-২০০)",125,8.50],["তৃতীয় ধাপ (২০১-৩০০)",100,9.10],
 ["চতুর্থ ধাপ (৩০১-৪০০)",100,9.62],["পঞ্চম ধাপ (৪০১-৬০০)",200,15.01],["ষষ্ঠ ধাপ (৬০০+)",null,17.35]];
// ===================
var $ = function(id){return document.getElementById(id);};
var f2 = function(n){return Number(n).toFixed(2);};
var r2 = function(n){return Math.round(n*100)/100;};
var esc = function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var current = null, records = [];

function store(){ try{ localStorage.setItem('bills', JSON.stringify(records)); }catch(e){} }
function load(){ try{ records = JSON.parse(localStorage.getItem('bills')||'[]'); }catch(e){ records = []; } }

function energy(u){
  if(u<=0) return {total:0, rows:[]};
  if(u<=LIFE_LIMIT) return {total:u*LIFE_RATE, rows:[{name:'লাইফ লাইন (০-৫০)',units:u,rate:LIFE_RATE,amount:r2(u*LIFE_RATE)}]};
  var rem=u, total=0, rows=[];
  for(var i=0;i<SLABS.length && rem>0;i++){
    var used = SLABS[i][1]===null ? rem : Math.min(rem,SLABS[i][1]);
    var amt = used*SLABS[i][2];
    rows.push({name:SLABS[i][0],units:r2(used),rate:SLABS[i][2],amount:r2(amt)});
    total+=amt; rem-=used;
  }
  return {total:total, rows:rows};
}
function makeBill(){
  var prev=parseFloat($('prev').value), curr=parseFloat($('curr').value);
  if(isNaN(prev)||isNaN(curr)) return null;
  if(curr<prev) return {error:'বর্তমান ইউনিট পূর্বের ইউনিটের চেয়ে কম হতে পারে না'};
  var vatPct=parseFloat($('vat').value)||0, other=parseFloat($('other').value)||0, load=parseFloat($('load').value)||0;
  var units=r2(curr-prev), e=energy(units);
  var demand=$('demand').checked ? load*DEMAND_RATE : 0;
  var vat=(e.total+demand)*vatPct/100;
  var d=new Date();
  return {name:$('name').value.trim()||'ভাড়াটিয়া',
    date:('0'+d.getDate()).slice(-2)+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+d.getFullYear(),
    prev:prev,curr:curr,units:units,rows:e.rows,vatPct:vatPct,energy:r2(e.total),demand:r2(demand),
    vat:r2(vat),other:r2(other),total:r2(e.total+demand+vat+other)};
}
function renderBill(r){
  var rows=r.rows.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td class="n">'+x.units+'</td><td class="n">'+f2(x.rate)+'</td><td class="n">'+f2(x.amount)+'</td></tr>';}).join('');
  $('bill').innerHTML='<div class="head"><b>'+HOUSE+'</b>বিদ্যুৎ বিল</div>'+
   '<div class="info"><span>ভাড়াটিয়া: <b>'+esc(r.name)+'</b></span><span>তারিখ: '+esc(r.date)+'</span></div>'+
   '<div class="info"><span>পূর্বের: '+r.prev+'</span><span>বর্তমান: '+r.curr+'</span><span>ব্যবহার: <b>'+r.units+' ইউনিট</b></span></div>'+
   '<div class="scroll"><table><thead><tr><th>ধাপ</th><th class="n">ইউনিট</th><th class="n">রেট</th><th class="n">টাকা</th></tr></thead><tbody>'+rows+
   '<tr><td colspan="3">এনার্জি চার্জ</td><td class="n">'+f2(r.energy)+'</td></tr>'+
   (r.demand?'<tr><td colspan="3">ডিমান্ড চার্জ</td><td class="n">'+f2(r.demand)+'</td></tr>':'')+
   '<tr><td colspan="3">ভ্যাট ('+r.vatPct+'%)</td><td class="n">'+f2(r.vat)+'</td></tr>'+
   (r.other?'<tr><td colspan="3">অন্যান্য</td><td class="n">'+f2(r.other)+'</td></tr>':'')+
   '<tr class="tot"><td colspan="3">সর্বমোট বিল</td><td class="n">'+f2(r.total)+' ৳</td></tr></tbody></table></div>';
}
function billText(r){
  var t=HOUSE+'\nবিদ্যুৎ বিল\nভাড়াটিয়া: '+r.name+'\nতারিখ: '+r.date+'\nপূর্বের: '+r.prev+' | বর্তমান: '+r.curr+'\nব্যবহার: '+r.units+' ইউনিট\n';
  r.rows.forEach(function(x){t+=x.name+': '+x.units+' x '+f2(x.rate)+' = '+f2(x.amount)+'\n';});
  t+='এনার্জি চার্জ: '+f2(r.energy)+'\n';
  if(r.demand) t+='ডিমান্ড চার্জ: '+f2(r.demand)+'\n';
  t+='ভ্যাট ('+r.vatPct+'%): '+f2(r.vat)+'\n';
  if(r.other) t+='অন্যান্য: '+f2(r.other)+'\n';
  return t+'সর্বমোট বিল: '+f2(r.total)+' টাকা';
}
function calc(){
  $('loadbox').style.display=$('demand').checked?'block':'none';
  var r=makeBill(); current=null;
  if(!r){ $('bill').innerHTML='<p class="hint">পূর্বের ও বর্তমান ইউনিট লিখলেই বিল এখানে দেখাবে।</p>'; return; }
  if(r.error){ $('bill').innerHTML='<p class="err">'+r.error+'</p>'; return; }
  current=r; renderBill(r);
}
function renderRecords(){
  var last={};
  records.forEach(function(r){last[r.name]=r.curr;});
  $('tenants').innerHTML=Object.keys(last).map(function(n){return '<option value="'+esc(n)+'">';}).join('');
  window.lastCurr=last;
  $('recs').innerHTML=records.slice().reverse().map(function(r){
    return '<tr><td>'+esc(r.date)+'</td><td>'+esc(r.name)+'</td><td class="n">'+r.prev+'</td><td class="n">'+r.curr+'</td><td class="n">'+r.units+
    '</td><td class="n">'+f2(r.total)+'</td><td class="n"><button class="sm sec" onclick="view('+r.id+')">দেখুন</button> <button class="sm del" onclick="del('+r.id+')">মুছুন</button></td></tr>';
  }).join('')||'<tr><td colspan="7" class="hint">এখনো কিছু সংরক্ষণ করা হয়নি</td></tr>';
}
function view(id){ var r=records.filter(function(x){return x.id===id;})[0]; if(r){current=r;renderBill(r);window.scrollTo(0,0);} }
function del(id){ if(confirm('এই হিসাবটি মুছে ফেলবেন?')){ records=records.filter(function(x){return x.id!==id;}); store(); renderRecords(); } }

$('name').addEventListener('change',function(){
  var n=$('name').value.trim();
  if(window.lastCurr && n in window.lastCurr){ $('prev').value=window.lastCurr[n]; $('curr').value=''; $('curr').focus(); calc(); }
});
['prev','curr','vat','other','load','demand'].forEach(function(id){$(id).addEventListener('input',calc);});
$('saveBtn').addEventListener('click',function(){
  calc();
  if(!current||current.id){ alert('আগে পূর্বের ও বর্তমান ইউনিট সঠিকভাবে লিখুন'); return; }
  current.id=Date.now(); records.push(current); store(); renderRecords();
  $('prev').value=current.curr; $('curr').value='';
});
// ===== PDF তৈরি (কোনো লাইব্রেরি ছাড়া, অফলাইনে কাজ করে) =====
var FONT='"Noto Sans Bengali","Nirmala UI","Kalpurush","Siyam Rupali",sans-serif';
function billCanvas(r){
  var W=794,S=2,pad=50,lh=30,c=document.createElement('canvas');
  c.width=W*S; c.height=1400*S;
  var x=c.getContext('2d'); x.scale(S,S); x.fillStyle='#fff'; x.fillRect(0,0,W,1400); x.fillStyle='#000';
  function t(s,px,py,sz,bold,al){ x.font=(bold?'bold ':'')+sz+'px '+FONT; x.textAlign=al||'left'; x.fillText(String(s),px,py); }
  function ln(py,w){ x.strokeStyle='#777'; x.lineWidth=w||1; x.beginPath(); x.moveTo(pad,py); x.lineTo(W-pad,py); x.stroke(); }
  var y=70;
  t(HOUSE,W/2,y,36,true,'center'); y+=38; t('বিদ্যুৎ বিল',W/2,y,22,false,'center'); y+=20; ln(y); y+=36;
  t('ভাড়াটিয়া: '+r.name,pad,y,19,true); t('তারিখ: '+r.date,W-pad,y,19,false,'right'); y+=34;
  t('পূর্বের: '+r.prev,pad,y,19); t('বর্তমান: '+r.curr,W/2,y,19,false,'center'); t('ব্যবহার: '+r.units+' ইউনিট',W-pad,y,19,true,'right'); y+=20; ln(y); y+=32;
  t('ধাপ',pad,y,17,true); t('ইউনিট',470,y,17,true,'right'); t('রেট',590,y,17,true,'right'); t('টাকা',W-pad,y,17,true,'right'); y+=12; ln(y); y+=lh;
  r.rows.forEach(function(q){ t(q.name,pad,y,17); t(q.units,470,y,17,false,'right'); t(f2(q.rate),590,y,17,false,'right'); t(f2(q.amount),W-pad,y,17,false,'right'); y+=lh; });
  ln(y-lh+10); y+=4;
  function sum(l,v){ t(l,pad,y,18); t(f2(v),W-pad,y,18,false,'right'); y+=lh; }
  sum('এনার্জি চার্জ',r.energy);
  if(r.demand) sum('ডিমান্ড চার্জ',r.demand);
  sum('ভ্যাট ('+r.vatPct+'%)',r.vat);
  if(r.other) sum('অন্যান্য',r.other);
  y+=2; ln(y-lh+12,2); y+=10;
  t('সর্বমোট বিল',pad,y,24,true); t(f2(r.total)+' টাকা',W-pad,y,24,true,'right'); y+=16; ln(y,2);
  var h=y+50, o=document.createElement('canvas'); o.width=W*S; o.height=h*S;
  var ox=o.getContext('2d'); ox.fillStyle='#fff'; ox.fillRect(0,0,o.width,o.height);
  ox.drawImage(c,0,0,W*S,h*S,0,0,W*S,h*S);
  return o;
}
function makePdf(cv){
  var bin=atob(cv.toDataURL('image/jpeg',0.92).split(',')[1]), jpg=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) jpg[i]=bin.charCodeAt(i);
  var pw=595.28, ph=841.89, iw=pw, ih=pw*cv.height/cv.width;
  if(ih>ph){ ih=ph; iw=ph*cv.width/cv.height; }
  var enc=new TextEncoder(), parts=[], off=0, xr=[];
  function add(d){ if(typeof d==='string') d=enc.encode(d); parts.push(d); off+=d.length; }
  function obj(n,head,body){ xr[n]=off; add(n+' 0 obj\n'+head); if(body){ add('\nstream\n'); add(body); add('\nendstream'); } add('\nendobj\n'); }
  add('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  obj(4,'<< /Type /XObject /Subtype /Image /Width '+cv.width+' /Height '+cv.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>',jpg);
  var cs='q '+iw.toFixed(2)+' 0 0 '+ih.toFixed(2)+' '+((pw-iw)/2).toFixed(2)+' '+(ph-ih).toFixed(2)+' cm /Im0 Do Q';
  obj(5,'<< /Length '+cs.length+' >>',cs);
  var xo=off; add('xref\n0 6\n0000000000 65535 f \n');
  for(i=1;i<=5;i++) add(('0000000000'+xr[i]).slice(-10)+' 00000 n \n');
  add('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
function pdfFile(){
  if(!current){ alert('আগে বিল তৈরি করুন'); return null; }
  try{
    window.lastCv=billCanvas(current);
    var nm='bill_'+current.name.replace(/[^\w\u0980-\u09FF]+/g,'_')+'_'+current.date+'.pdf';
    var blob=makePdf(window.lastCv), f;
    try{ f=new File([blob],nm,{type:'application/pdf'}); }catch(e){ f=blob; f.name=nm; }
    return f;
  }catch(e){ alert('PDF তৈরি করা যায়নি: '+(e&&e.message?e.message:e)); return null; }
}
function b64(blob){ return new Promise(function(res){ var r=new FileReader(); r.onload=function(){res(String(r.result).split(',')[1]);}; r.readAsDataURL(blob); }); }
function cap(n){ return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins[n]; }
function showOverlay(f){
  $('pv').src=window.lastCv.toDataURL('image/jpeg',0.9);
  var a=$('dl'); a.href=URL.createObjectURL(f); a.download=f.name; a.target='_blank';
  var a2=$('dl2'); a2.download=f.name; a2.target='_blank';
  b64(f).then(function(d){ a2.href='data:application/pdf;base64,'+d; });
  $('ov').style.display='block';
}
$('ovClose').addEventListener('click',function(){ $('ov').style.display='none'; });
function printPlugin(){
  var C=window.Capacitor;
  if(!C || !(C.isNativePlatform ? C.isNativePlatform() : false)) return null;
  return C.registerPlugin ? C.registerPlugin('PdfPrint') : (C.Plugins && C.Plugins.PdfPrint);
}
$('printBtn').addEventListener('click',async function(){
  var f=pdfFile(); if(!f) return;
  try{
    var P=printPlugin();
    if(P){ await P.print({data:await b64(f),name:f.name}); return; }   // অ্যান্ড্রয়েডের নিজস্ব প্রিন্ট স্ক্রিন
    if(cap('Filesystem')){
      await cap('Filesystem').writeFile({path:f.name,data:await b64(f),directory:'DOCUMENTS'});
      alert('PDF সেভ হয়েছে (Documents ফোল্ডারে)। ফাইলটি খুলে প্রিন্ট দিন।'); return;
    }
  }catch(e){ alert('প্রিন্ট চালু করা যায়নি: '+(e&&e.message?e.message:e)); }
  showOverlay(f);
});
$('shareBtn').addEventListener('click',async function(){
  var f=pdfFile(); if(!f) return;
  try{
    if(cap('Filesystem') && cap('Share')){
      await cap('Filesystem').writeFile({path:f.name,data:await b64(f),directory:'CACHE'});
      var u=await cap('Filesystem').getUri({path:f.name,directory:'CACHE'});
      await cap('Share').share({title:HOUSE+' বিদ্যুৎ বিল',url:u.uri}); return;
    }
    if(navigator.canShare && navigator.canShare({files:[f]})){
      await navigator.share({files:[f],title:HOUSE+' বিদ্যুৎ বিল'}); return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  showOverlay(f);
});
$('csvBtn').addEventListener('click',function(){
  if(!records.length){alert('এখনো কিছু সংরক্ষণ করা হয়নি');return;}
  var rows=[['তারিখ','নাম','পূর্বের','বর্তমান','ইউনিট','এনার্জি','ডিমান্ড','ভ্যাট','অন্যান্য','মোট']];
  records.forEach(function(r){rows.push([r.date,'"'+r.name.replace(/"/g,'""')+'"',r.prev,r.curr,r.units,r.energy,r.demand,r.vat,r.other,r.total]);});
  var blob=new Blob(['\ufeff'+rows.map(function(x){return x.join(',');}).join('\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='bidyut_bill.csv'; document.body.appendChild(a); a.click(); a.remove();
});
load(); renderRecords();
